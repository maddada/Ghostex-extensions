<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench: this week</title>
<style>
  /* Drawn in the block Ghostex gives it (Focus tab, and the side panel): quiet ink on the sidebar's own dark. */
  :root { color-scheme: dark; --ink: #b4b8c0; --muted: #7c828c; --bar: #6f7680; --today: #c9cdd4; --bg: #141414; }
  @media (prefers-color-scheme: light) {
    :root { color-scheme: light; --ink: #262626; --muted: #6b7280; --bar: #a3a8b0; --today: #4b5058; --bg: #f2f2f2; }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 12px/1.3 system-ui, sans-serif; overflow: hidden; }
  main { display: flex; flex-direction: column; height: 100%; padding: 8px 10px 6px; box-sizing: border-box; gap: 6px; }
  header { display: flex; justify-content: space-between; color: var(--muted); }
  .bars { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; min-height: 0; }
  .day { display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; justify-content: flex-end; }
  .bar { width: 100%; max-width: 22px; border-radius: 3px; background: var(--bar); min-height: 2px; }
  .day.today .bar { background: var(--today); }
  .count { color: var(--muted); font-size: 10px; }
  .label { color: var(--muted); font-size: 10px; }
  .note { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header><span>Active sessions</span><span id="total"></span></header>
  <div class="bars" id="bars"></div>
</main>
<script>
  // A Workbench web block: the sessions this computer had active on each of the last 7 days, read
  // through the extension bridge (ghostex.sessions(), with the sessions.read permission) and drawn
  // again whenever they change (ghostex.on('sessions')).
  const bars = document.getElementById('bars');
  const total = document.getElementById('total');
  const DAY = 24 * 60 * 60 * 1000;

  function days() {
    const start = new Date();
    start.setHours(0, 0, 0, 0);
    return Array.from({ length: 7 }, (_, index) => new Date(start.getTime() - (6 - index) * DAY));
  }

  function draw(sessions) {
    const range = days();
    const counts = range.map(() => 0);
    for (const session of sessions) {
      const at = Date.parse(session.lastActiveAt || '');
      if (Number.isNaN(at)) continue;
      const index = range.findIndex((day) => at >= day.getTime() && at < day.getTime() + DAY);
      if (index >= 0) counts[index] += 1;
    }
    const most = Math.max(1, ...counts);
    bars.replaceChildren(
      ...range.map((day, index) => {
        const column = document.createElement('div');
        column.className = index === 6 ? 'day today' : 'day';
        column.title = `${counts[index]} on ${day.toLocaleDateString(undefined, { weekday: 'long' })}`;
        const count = document.createElement('div');
        count.className = 'count';
        count.textContent = counts[index] ? String(counts[index]) : '';
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.height = `${(counts[index] / most) * 70}%`;
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = day.toLocaleDateString(undefined, { weekday: 'narrow' });
        column.append(count, bar, label);
        return column;
      }),
    );
    const sum = counts.reduce((left, right) => left + right, 0);
    total.textContent = `${sum} this week`;
  }

  function note(text) {
    const line = document.createElement('div');
    line.className = 'note';
    line.textContent = text;
    bars.replaceChildren(line);
    total.textContent = '';
  }

  let pending = null;
  async function refresh() {
    try {
      draw(await window.ghostex.sessions());
    } catch (error) {
      note(error?.code === 'forbidden' ? 'Allow "See your sessions" in Settings > Extensions.' : 'Ghostex is busy. Trying again soon.');
    }
  }

  function start() {
    refresh();
    // Sessions change many times a minute while agents work; redraw at most every few seconds.
    window.ghostex.on('sessions', () => {
      pending ??= setTimeout(() => {
        pending = null;
        refresh();
      }, 3000);
    });
  }

  // Ghostex adds `window.ghostex` once the page has loaded and says so with `ghostexready`.
  if (window.ghostex) start();
  else window.addEventListener('ghostexready', start, { once: true });
</script>
</body>
</html>
